name: Security Phase 1 CI

on:
  push:
    branches:
      - "security/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile for security-upgraded dependencies
        run: npm cache clean --force && rm -rf node_modules package-lock.json && npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Commit regenerated dependency lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate lockfile for security updates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: security-phase-1-lockfile
          path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Start server for integration tests
        run: |
          SUPABASE_URL=https://example.supabase.co SUPABASE_SERVICE_KEY=test PORT=3001 npm start > /tmp/mounadev-hub.log 2>&1 &
          echo $! > /tmp/mounadev-hub.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mounadev-hub.log
          exit 1
      - name: Unit and integration tests
        run: npm test
      - name: Stop test server
        if: always()
        run: if [ -f /tmp/mounadev-hub.pid ]; then kill "$(cat /tmp/mounadev-hub.pid)" || true; fi
      - name: Dependency security audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2)); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log(name + ': ' + item.severity + ' | fix=' + JSON.stringify(item.fixAvailable));"
